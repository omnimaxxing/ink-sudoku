[project]
name = "hwrtrain"
version = "0.1.0"
description = "Training pipeline for the sudoku tablet digit recognizer (backend/hwr)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-image>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hwrtrain"]
